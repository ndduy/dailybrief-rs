[package]
name = "dailybrief"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.104"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
