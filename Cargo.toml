[package]
name = "dailybrief"
version = "0.1.0"
edition = "2024"
default-run = "dailybrief"

[[bin]]
name = "gen-schemas"
path = "src/bin/gen_schemas.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.0"
dom_smoothie = "0.18.1"
fastembed = { version = "7.0.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
feed-rs = "2.4.0"
futures-util = "0.3.34"
maud = { version = "0.27.0", features = ["axum"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
readability = { version = "0.3.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "charset", "gzip", "rustls", "stream"] }
rmcp = { version = "3.4.0", features = ["server", "transport-io", "macros", "schemars", "client"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
