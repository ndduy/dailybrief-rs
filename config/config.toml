# dailybrief service configuration (SPEC.md §7). The values shown here are the defaults for omitted keys.
# feeds.toml and topics.toml are read from the same directory as this file.
# Environment overrides: DAILYBRIEF_CONFIG (path to this file), DAILYBRIEF_DATA_DIR, DAILYBRIEF_BIND, DAILYBRIEF_IN_CONTAINER.

[service]
bind = "127.0.0.1"          # "0.0.0.0" is accepted only inside the container (DAILYBRIEF_IN_CONTAINER=1)
port = 8788
timezone = "Asia/Ho_Chi_Minh"
data_dir = "data"           # relative to the project root (the parent of config/); the container sets DAILYBRIEF_DATA_DIR=/data

[schedule]
cron = "30 6 * * *"         # morning run, in service.timezone

[retention]
days = 60                   # run directories and run_events older than this are pruned by the daily job; runs rows stay (ADR 0013)
cron = "0 7 * * *"          # the prune job, after the morning run window, in service.timezone

[caps]                      # digest contract, spec/m1.md §8.2
reads = 45
for_you = 24
beyond_radar = 6
per_source = 4
per_topic = 8
web_search = 5
read_text_chars = 5000
shown_days = 14
candidate_days = 7

[ingest]
concurrency = 6
request_timeout_ms = 15000
total_budget_ms = 120000
body_max_bytes = 2097152
max_redirects = 3
dedupe_cosine = 0.92
# allow_loopback = false  # never in production: private, link-local, CGNAT and loopback targets are refused, redirects included

[embeddings]
model = "Xenova/bge-small-en-v1.5"
dimensions = 384

[harness]
default = "claude-code"
mcp_command = "dailybrief"   # written into each run's mcp.json; the harness spawns it with mcp_args
mcp_args = ["mcp"]

[harness.claude-code]
model = "opus"
max_turns = 120
wall_clock_minutes = 15
